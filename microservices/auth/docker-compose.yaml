services:
  auth-service:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: eco-point-auth-service
    ports:
      - "8001:8001"
    volumes:
      - ../../common:/app/common:ro
      - .:/app/microservices/auth
      - ./.env:/app/microservices/auth/.env:ro
      - ./keys:/app/microservices/auth/keys:ro
      - ./auth.db:/app/microservices/auth/auth.db
      - ./alembic.ini:/app/microservices/auth/alembic.ini:ro
      - ./migrations:/app/microservices/auth/migrations:ro
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///app/microservices/auth/auth.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=RS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    networks:
      - eco-point-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  eco-point-network:
    external: true