services:
  bins-service:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: eco-point-bins-service-service
    ports:
      - "8002:8002"
    volumes:
      - ../../common:/app/common:ro
      - .:/app/microservices/bins
      - ./.env:/app/microservices/bins/.env:ro
      - ./bins.db:/app/microservices/bins/bins.db
      - ./alembic.ini:/app/microservices/bins/alembic.ini:ro
      - ./migrations:/app/microservices/bins/migrations:ro
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///app/microservices/bins/bins.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=RS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    networks:
      - eco-point-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/bins/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  eco-point-network:
    external: true