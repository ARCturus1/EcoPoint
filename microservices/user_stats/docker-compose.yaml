services:
  user-stats-service:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: eco-point-user-stats-service
    ports:
      - "8003:8003"
    volumes:
      - ../../common:/app/common:ro
      - .:/app/microservices/user_stats
      - ./.env:/app/microservices/user_stats/.env:ro
      - ./user_stats.db:/app/microservices/user_stats/user_stats.db
      - ./alembic.ini:/app/microservices/user_stats/alembic.ini:ro
      - ./migrations:/app/microservices/user_stats/migrations:ro
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///app/microservices/user_stats/user_stats.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=RS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    networks:
      - eco-point-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/user-stats/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  eco-point-network:
    external: true