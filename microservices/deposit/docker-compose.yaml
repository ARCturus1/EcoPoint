services:
  deposit-service:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: eco-point-deposit-service
    ports:
      - "8004:8004"
    volumes:
      - ../../common:/app/common:ro
      - .:/app/microservices/deposit
      - ./.env:/app/microservices/deposit/.env:ro
      - ./deposit.db:/app/microservices/deposit/deposit.db
      - ./alembic.ini:/app/microservices/deposit/alembic.ini:ro
      - ./migrations:/app/microservices/deposit/migrations:ro
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///app/microservices/deposit/deposit.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=RS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    networks:
      - eco-point-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/deposit/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  eco-point-network:
    external: true