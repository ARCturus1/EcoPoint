services:
  gateway:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: eco-point-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./krakend.json:/etc/krakend/krakend.json:ro
      - ./.env:/etc/krakend/.env:ro
    networks:
      - eco-point-network
    depends_on:
      - auth-service
      - user-stats-service
      - bins-service
      - deposit-service
    restart: unless-stopped
    environment:
      - FC_ENABLE=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  eco-point-network:
    external: true